<style>
:root {
  --paper: #f7f3ea;
  --paper-2: #fbf8f1;
  --ink: #1e2a44;
  --ink-soft: #4a5568;
  --ink-faint: #7a8499;
  --line: #d9d2c3;
  --line-soft: #e8e1d2;
  --blue: #2b5aa8;
  --blue-soft: #e8f1ff;
  --red: #e85a4f;
  --red-soft: #fdeceb;
  --yellow: #ffe566;
  --yellow-soft: #fff6c8;
  --green: #2f7d4a;
  --green-soft: #e6f5eb;
  --orange: #d97706;
  --orange-soft: #fff1df;
  --gray: #6b7280;
  --gray-soft: #eef0f3;
  --max: 980px;
  --radius: 14px;
  --shadow: 2px 3px 0 rgba(43,90,168,.08);
  --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 8%, rgba(255,229,102,.18), transparent 28%),
    radial-gradient(circle at 88% 4%, rgba(232,90,79,.08), transparent 22%),
    var(--paper);
  line-height: 1.55;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

/* Hero */
.hero { padding: 36px 0 18px; }
.hero h1 {
  margin: 14px 0 10px; font-size: clamp(26px, 4vw, 34px);
  line-height: 1.25; letter-spacing: -.02em; color: var(--ink);
}
.legend {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
  font-size: 12px; color: var(--ink-soft);
}
.legend i {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 4px; vertical-align: middle;
}

/* Sticky filters */
.filters {
  position: sticky; top: 0; z-index: 40;
  background: rgba(247,243,234,.92);
  backdrop-filter: blur(10px);
  border-bottom: 1.5px solid var(--line);
  padding: 10px 0 12px;
}
.filters-inner { display: flex; flex-direction: column; gap: 10px; }
.row-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1.5px solid var(--line); background: #fff; color: var(--ink-soft);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
  font-size: 13px; transition: .15s ease;
}
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.active {
  background: var(--blue); border-color: var(--blue); color: #fff;
  box-shadow: 1px 2px 0 rgba(30,42,68,.15);
}
.chip .n { opacity: .75; margin-left: 4px; font-size: 11px; }
.chip.active .n { opacity: .9; }
.cat-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-tab {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1.5px solid var(--line); background: #fff;
  border-radius: 12px; padding: 7px 11px; cursor: pointer;
  font-size: 13px; color: var(--ink-soft);
}
.cat-tab img, .cat-tab .svg-ico, .row-title img {
  width: 22px; height: 22px; border-radius: 6px; object-fit: cover;
  background: #1a1a1a; flex: 0 0 auto; border: 1px solid var(--line);
}
.row-title img { width: 20px; height: 20px; }
.cat-tab.active {
  border-color: var(--blue); background: var(--blue-soft); color: var(--blue);
  font-weight: 600;
}
.result-meta {
  font-size: 12px; color: var(--ink-faint); margin: 8px 0 0;
}

/* List */
.list { padding: 16px 0 64px; display: flex; flex-direction: column; gap: 8px; }
.row {
  background: var(--paper-2);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: border-color .15s ease;
}
.row:hover { border-color: #c4bba8; }
.row.open { border-color: var(--blue); background: #fff; }
.row-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  padding: 12px 14px;
  cursor: pointer;
  align-items: start;
  user-select: none;
}
.row-title {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  font-weight: 650; font-size: 15px; color: var(--ink);
}
.row-purpose {
  grid-column: 1 / -1;

.row.open .row-purpose { -webkit-line-clamp: 3; }
.meta-right {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;

}
.badge {

  border-radius: 999px; padding: 3px 8px; border: 1px solid transparent;

.badge.skill { background: #fff3df; color: #8a5a12; border-color: #f0d4a0; }

.badge.net-intranet { background: var(--green-soft); color: var(--green); border-color: #b7dfc4; }

.badge.net-hybrid { background: var(--blue-soft); color: var(--blue); border-color: #b9d0f5; }
.badge.net-unknown { background: var(--gray-soft); color: var(--gray); border-color: #d1d5db; }
.chev {
  width: 18px; height: 18px; color: var(--ink-faint);
  transition: transform .18s ease; flex: 0 0 auto;
}
.row.open .chev { transform: rotate(180deg); color: var(--blue); }

.panel {
  display: none;
  border-top: 1.5px dashed var(--line-soft);
  padding: 0 14px 16px;
}
.row.open .panel { display: block; }
.panel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 14px;
}

.block h4 {
  margin: 0 0 8px; font-size: 12px; letter-spacing: .06em;

.block ul { margin: 0; padding-left: 18px; }
.block li { margin: 4px 0; color: var(--ink); font-size: 13.5px; }
.steps { counter-reset: step; list-style: none; padding: 0; margin: 0; }
.steps li {
  position: relative; padding: 6px 0 6px 34px;
  border-left: 2px solid var(--yellow);
  margin-left: 10px;
}
.steps li::before {
  counter-increment: step;
  content: counter(step);
  position: absolute; left: -11px; top: 6px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--blue); color: #fff; font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.example {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  grid-column: 1 / -1;
}
.example .pair { display: grid; grid-template-columns: 56px 1fr; gap: 8px; margin: 6px 0; }
.example .who {

  border-radius: 8px; padding: 4px 0; align-self: start;

.example .who.agent { background: var(--blue); }
.example .say { font-size: 13.5px; color: var(--ink); background: #fff;

.diagram-wrap {

  background: #fff; border: 1.5px solid var(--line); border-radius: 12px;

.diagram-wrap .mermaid { margin: 0 auto; }
.foot-links {

.foot-links a { color: var(--blue); }
.empty {

.footer {
  padding: 8px 0 40px; color: var(--ink-faint); font-size: 12px;
  border-top: 1px solid var(--line-soft);
}

<script>
(function () {
  const catalog = JSON.parse(document.getElementById('catalog').textContent);
  const icons = JSON.parse(document.getElementById('icons').textContent);
  const items = catalog.items || [];

  const TYPE_LABEL = { skill: 'Skill', 'skill-pack': 'Skill Pack', mcp: 'MCP' };
  const NET_LABEL = {
    intranet: '若是内网环境需实际测试',
    server_egress: '需服务端外网',
    hybrid: '混合',
    unknown: '视部署'
  };
  const CAT_ORDER = (catalog.categories || []).map(c => c.id);

  const state = { cat: 'all', type: 'all', net: 'all' };
  let mermaidReady = false;
  let mermaidInit = false;

  function ensureMermaid(cb) {
    if (window.mermaid) {
      if (!mermaidInit) {
        mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose',
          flowchart: { curve: 'basis', htmlLabels: true } });
        mermaidInit = true;
      }
      mermaidReady = true;
      cb && cb();
      return;
    }
    setTimeout(() => ensureMermaid(cb), 60);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function typeBadge(t) {
    const cls = t === 'skill-pack' ? 'skill-pack' : t;
    return `<span class="badge ${cls}">${esc(TYPE_LABEL[t] || t)}</span>`;
  }
  function netBadge(n) {
    return `<span class="badge net-${esc(n)}">${esc(NET_LABEL[n] || n)}</span>`;
  }

  function parseExample(text) {
    if (!text) return null;
    const lines = String(text).split(/\n+/).map(s => s.trim()).filter(Boolean);
    let boss = '', agent = '';
    for (const line of lines) {
      if (/^(?:你说|\u8001\u677f\u8bf4)[：:]/.test(line)) boss = line.replace(/^(?:你说|\u8001\u677f\u8bf4)[：:]\s*/, '');
      else if (/^Agent(?:做)?[：:]/.test(line)) agent = line.replace(/^Agent(?:做)?[：:]\s*/, '');
      else if (!boss) boss = line;
      else agent += (agent ? ' ' : '') + line;
    }
    return { boss, agent };
  }

  // Category tabs
  const catMap = Object.fromEntries((catalog.categories || []).map(c => [c.id, c]));
  const catTabs = document.getElementById('catTabs');
  function catIcon(id) {
    const src = icons[id];
    if (!src) return '';
    return `<img src="${src}" alt="" width="22" height="22" loading="lazy" />`;
  }
  function renderCats() {
    const allCount = items.length;
    let html = `<button class="cat-tab ${state.cat==='all'?'active':''}" data-cat="all">全部<span class="n"> ${allCount}</span></button>`;
    for (const id of CAT_ORDER) {
      const c = catMap[id];
      const n = items.filter(i => i.category === id).length;
      html += `<button class="cat-tab ${state.cat===id?'active':''}" data-cat="${esc(id)}">${catIcon(id)}<span>${esc(c.label_zh)}<span class="n"> ${n}</span></span></button>`;
    }
    catTabs.innerHTML = html;
  }

  function makeChips(container, stateKey, options) {
    container.innerHTML = options.map(([val, label]) => {
      const active = state[stateKey] === val ? 'active' : '';
      let n = '';
      if (val !== 'all') {
        const field = stateKey === 'type' ? 'type' : 'network';
        n = ` <span class="n">${items.filter(i => i[field] === val).length}</span>`;
      }
      return `<button type="button" class="chip ${active}" data-key="${stateKey}" data-val="${esc(val)}">${esc(label)}${n}</button>`;
    }).join('');
  }

  makeChips(document.getElementById('typeChips'), 'type', [
    ['all', '全部类型'],
    ['skill', 'Skill'],
    ['skill-pack', 'Skill Pack'],
    ['mcp', 'MCP']
  ]);
  makeChips(document.getElementById('netChips'), 'net', [
    ['all', '全部网络'],
    ['intranet', '若是内网环境需实际测试'],
    ['server_egress', '需服务端外网'],
    ['hybrid', '混合'],
    ['unknown', '视部署']
  ]);
  renderCats();

  function match(item) {
    if (state.cat !== 'all' && item.category !== state.cat) return false;
    if (state.type !== 'all' && item.type !== state.type) return false;
    if (state.net !== 'all' && item.network !== state.net) return false;
    return true;
  }

  function filtered() {
    const list = items.filter(match);
    // Skills first within each category order
    const typeRank = { skill: 0, 'skill-pack': 1, mcp: 2 };
    const catRank = Object.fromEntries(CAT_ORDER.map((id, i) => [id, i]));
    list.sort((a, b) => {
      const ca = catRank[a.category] ?? 99, cb = catRank[b.category] ?? 99;
      if (ca !== cb) return ca - cb;
      const ta = typeRank[a.type] ?? 9, tb = typeRank[b.type] ?? 9;
      if (ta !== tb) return ta - tb;
      return a.name.localeCompare(b.name, 'zh');
    });
    return list;
  }

  const listEl = document.getElementById('list');
  const metaEl = document.getElementById('resultMeta');
  const openIds = new Set();

  function renderList() {
    const list = filtered();
    metaEl.textContent = `显示 ${list.length} / ${items.length} 条`;
    if (!list.length) {
      listEl.innerHTML = `<div class="empty">没有匹配条目，试试清空筛选或换个关键词。</div>`;
      return;
    }
    listEl.innerHTML = list.map(item => {
      const open = openIds.has(item.id) ? 'open' : '';
      const cat = catMap[item.category];
      const ex = parseExample(item.interaction_example);
      const points = (item.key_points || []).map(p => `<li>${esc(p)}</li>`).join('');
      const steps = (item.workflow || []).map(s => `<li>${esc(s)}</li>`).join('');
      const note = item.network_note ? `<span>网络说明：${esc(item.network_note)}</span>` : '';
      const url = item.url ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">来源</a>` : '';
      const exHtml = ex ? `
        <div class="example block">
          <h4>交互示例</h4>
          <div class="pair"><div class="who boss">你说</div><div class="say">${esc(ex.boss)}</div></div>
          <div class="pair"><div class="who agent">Agent</div><div class="say">${esc(ex.agent)}</div></div>
        </div>` : '';
      const diagram = item.diagram ? `
        <div class="diagram-wrap block" data-diagram-for="${esc(item.id)}">
          <h4>流程示意</h4>
          <pre class="mermaid">${esc(item.diagram)}</pre>
        </div>` : '';
      return `
      <article class="row ${open}" data-id="${esc(item.id)}">
        <div class="row-head" role="button" tabindex="0" aria-expanded="${open?'true':'false'}">
          <div class="row-title">
            ${catIcon(item.category)}
            <span>${esc(item.name)}</span>
            ${typeBadge(item.type)}
            ${netBadge(item.network)}
          </div>
          <div class="meta-right">
            <span class="badge" style="background:#fff;border-color:var(--line);color:var(--ink-faint);font-weight:600">${esc((cat&&cat.label_zh)||item.category)}</span>
            <svg class="chev" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 7.5 L10 12.5 L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <p class="row-purpose">${esc(item.purpose || '')}</p>
        </div>
        <div class="panel">
          <div class="panel-grid">
            <div class="block"><h4>关键点</h4><ul>${points}</ul></div>
            <div class="block"><h4>执行流程</h4><ol class="steps">${steps}</ol></div>
            ${exHtml}
            ${diagram}
          </div>
          <div class="foot-links">${note}${url}</div>
        </div>
      </article>`;
    }).join('');

    // Lazy mermaid for already-open rows
    list.filter(i => openIds.has(i.id) && i.diagram).forEach(i => runMermaid(i.id));
  }

  function runMermaid(id) {
    ensureMermaid(() => {
      const wrap = listEl.querySelector(`[data-diagram-for="${CSS.escape(id)}"]`);
      if (!wrap) return;
      const node = wrap.querySelector('.mermaid');
      if (!node || node.dataset.rendered === '1') return;
      mermaid.run({ nodes: [node] }).then(() => { node.dataset.rendered = '1'; }).catch(() => {});
    });
  }

  function toggleRow(id) {
    if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
    const row = listEl.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    if (!row) return;
    row.classList.toggle('open', openIds.has(id));
    const head = row.querySelector('.row-head');
    if (head) head.setAttribute('aria-expanded', openIds.has(id) ? 'true' : 'false');
    if (openIds.has(id)) runMermaid(id);
  }

  listEl.addEventListener('click', (e) => {
    const head = e.target.closest('.row-head');
    if (!head) return;
    if (e.target.closest('a')) return;
    const row = head.closest('.row');
    if (row) toggleRow(row.dataset.id);
  });
  listEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const head = e.target.closest('.row-head');
    if (!head) return;
    e.preventDefault();
    toggleRow(head.closest('.row').dataset.id);
  });

  document.querySelector('.filters').addEventListener('click', (e) => {
    const cat = e.target.closest('[data-cat]');
    if (cat) {
      state.cat = cat.dataset.cat;
      renderCats();
      renderList();
      return;
    }
    const chip = e.target.closest('.chip[data-key]');
    if (chip) {
      state[chip.dataset.key] = chip.dataset.val;
      makeChips(document.getElementById('typeChips'), 'type', [
        ['all', '全部类型'], ['skill', 'Skill'], ['skill-pack', 'Skill Pack'], ['mcp', 'MCP']
      ]);
      makeChips(document.getElementById('netChips'), 'net', [
        ['all', '全部网络'], ['intranet', '若是内网环境需实际测试'], ['server_egress', '需服务端外网'],
        ['hybrid', '混合'], ['unknown', '视部署']
      ]);
      renderList();
    }
  });

  renderList();
})();
</script>
</body>
</html>
